<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Librarius</h1>
        </div>

        <div class="sidebar">
            <form action="" class="newBookForm">
                <input type="text" placeholder="Author" class="newBookAuthor" required>
                <input type="text" placeholder="Title" class="newBookTitle" required>
                <input type="number" placeholder="Pages" class="newBookPages" required>
                <br>
                <div>
                    <label for="read">Read?</label>
                    <input type="checkbox" id="read" class="read">
                </div>
                <button class="newBookBtn">New Book</button>
            </form>
        </div>
        <div class="books">
            <div class="headings">
                <p>Author:</p>
                <p>Title: </p>
                <p>Pages:</p>
                <p>read?</p>
                <p>remove</p>
            </div>
        </div>
        
        <!-- <div class="interaction">

            
        </div> -->

    </div>
        

</body>
</html>
